services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8282"
    expose:
      - "8282"
    volumes:
      - oauth-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8282/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oauth-data:
